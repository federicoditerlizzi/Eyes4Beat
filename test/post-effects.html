<!doctype html><meta charset="utf-8"><title>Post effects GPU regression</title>
<canvas id="canvas" width="64" height="64"></canvas><pre id="result">Running…</pre>
<script type="module">
import { BloomRenderer } from '../src/bloom-renderer.js';
import { blendPost } from '../src/post-effects.js';
import { normalizeLook } from '../src/looks.js';
const result=document.querySelector('#result');
try {
 const gl=document.querySelector('canvas').getContext('webgl2',{preserveDrawingBuffer:true});
 const r=new BloomRenderer(gl),off=normalizeLook(),on=normalizeLook({feedback:{amount:.9},kaleido:{segments:6,mix:1}});
 const assert=(value,message)=>{if(!value)throw Error(message)};
 const pixel=(target,x=32,y=32)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,target?.framebuffer||null);const p=new Uint8Array(4);if(target&&r.hdr){const f=new Float32Array(4);gl.readPixels(x,y,1,1,gl.RGBA,gl.FLOAT,f);return Array.from(f).map(v=>Math.round(v*255))}gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);return [...p]};
 const scene=color=>{r.beginScene(64,64,'off');gl.clearColor(...color,1);gl.clear(gl.COLOR_BUFFER_BIT)};
 const bloom={intensity:0,tint:[1,1,1],threshold:1,knee:.5,radius:.5,stretch:0};
 scene([.4,.2,.1]);const base=r.postProcess(off,1/60,0,{},true);
 assert(base===r.scene,'off passes must return original scene');assert(!r.history&&!r.kaleidoTarget,'off allocates no pass targets');
 r.render(bloom,[0,.75],[0,.75],1,base);const baseline=pixel();
 scene([.4,.2,.1]);const same=r.postProcess(off,1/60,1,{},true);r.render(bloom,[0,.75],[0,.75],1,same);
 assert(JSON.stringify(pixel())===JSON.stringify(baseline),'default output changed');
 scene([0,0,0]);gl.enable(gl.SCISSOR_TEST);gl.scissor(32,0,32,64);gl.clearColor(.8,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.disable(gl.SCISSOR_TEST);
 const folded=r.postProcess(on,1/60,0,{},false);assert(pixel(r.scene,16,48)[0]===0&&pixel(folded,16,48)[0]>190,'kaleido did not fold scene across center');
 scene([.8,.2,.1]);let output=r.postProcess(on,1/60,0,{},true);
 assert(output===r.history[0]&&r.kaleidoTarget,'kaleido and feedback not rendered');
 const seeded=pixel(output);scene([0,0,0]);output=r.postProcess(on,1/60,0,{},true);
 assert(Math.abs(pixel(output)[0]-seeded[0]*.9)<2,'feedback decay mismatch');
 const drift=normalizeLook({...on,feedback:{...on.feedback,driftX:.01}});scene([0,0,0]);output=r.postProcess(drift,1/60,0,{},true);assert(pixel(output,0,32)[0]>150,'feedback edge must mirror history instead of turning black');
 r.clearFeedback();scene([0,0,0]);output=r.postProcess(on,1/60,0,{},true);assert(pixel(output)[0]===0,'clear left trails');
 scene([.8,0,0]);r.postProcess(on,1/60,0,{},true);scene([0,0,0]);output=r.postProcess(on,1/60,0,{},false);assert(output===r.kaleidoTarget,'device switch must bypass only feedback');
 const other=normalizeLook({kaleido:{segments:12,mix:1}});
 assert(r.postProcess(blendPost(on,other,.5),1/60,0,{kaleido:1},false)===r.scene,'transition midpoint must bypass kaleido even with routing');
 const panic=r.postProcess(on,1/60,0,{},true,false);assert(panic===r.scene,'PANIC must bypass static effects');
 const mix=normalizeLook({feedback:{amount:.9,blend:'mix',zoom:.005,rotate:.5,driftX:.001,hueShift:.01}});
 output=r.postProcess(mix,1/30,1,{},true);r.beginScene(64,64,'high');gl.clearColor(.4,.2,.1,1);gl.clear(gl.COLOR_BUFFER_BIT);output=r.postProcess(mix,1/30,1,{},true);r.render({...bloom,intensity:.5},[0,.75],[0,.75],1,output);
 r.postProcess(normalizeLook({feedback:{amount:.98,zoom:.05,rotate:180}}),3600,1,{},true);

 const used=[],originalUse=r.use.bind(r);r.use=(...args)=>{used.push(args[0]);return originalUse(...args)};
 const flowLook=source=>normalizeLook({feedback:{amount:.9,flow:{strength:.01,scale:2,source}}});
 const pattern=()=>{scene([0,0,0]);gl.enable(gl.SCISSOR_TEST);gl.clearColor(.8,.2,.1,1);gl.scissor(32,0,32,64);gl.clear(gl.COLOR_BUFFER_BIT);gl.scissor(0,32,64,16);gl.clear(gl.COLOR_BUFFER_BIT);gl.disable(gl.SCISSOR_TEST)};
 const pixels=target=>{gl.bindFramebuffer(gl.FRAMEBUFFER,target.framebuffer);const data=r.hdr?new Float32Array(64*64*4):new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,r.hdr?gl.FLOAT:gl.UNSIGNED_BYTE,data);return data};
 const renderFlow=(source,strength)=>{r.clearFeedback();pattern();r.postProcess(flowLook(source),1/60,1,{},true);pattern();return pixels(r.postProcess(normalizeLook({feedback:{amount:.9,flow:{strength,scale:2,source}}}),1/30,1.1,{},true))};
 for(const source of ['noise','image']){
  const baseline=renderFlow(source,0);assert(used.at(-1)===4,'zero flow must use original feedback shader');
  const flowed=renderFlow(source,.01);assert(used.at(-1)===5,'flow variant not used');assert(flowed.some((v,i)=>Math.abs(v-baseline[i])>.0001),source+' flow did not advect history');
 }
 used.length=0;scene([0,0,0]);assert(r.postProcess(flowLook('noise'),1/60,2,{flow:1},false)===r.scene&&used.length===0,'feedback off must bypass flow');
 assert(r.postProcess(flowLook('noise'),1/60,2,{flow:1},true,false)===r.scene,'PANIC must bypass flow');
 r.resize(32,32,'high');assert(!r.history&&!r.historyValid,'resize retained history');
 assert(gl.getError()===gl.NO_ERROR,'WebGL error');r.dispose();
 const ldr=new BloomRenderer(gl);ldr.hdr=false;ldr.beginScene(16,16,'off');gl.clearColor(.5,.2,.1,1);gl.clear(gl.COLOR_BUFFER_BIT);const ldrScene=ldr.postProcess(on,1/60,0,{},true);ldr.render(bloom,[0,.75],[0,.75],1,ldrScene);assert(gl.getError()===gl.NO_ERROR,'RGBA8 fallback error');ldr.dispose();
 result.textContent='PASS: shader compile; default pixel identity; lazy allocation; kaleido + feedback; decay; clear; device bypass; mirrored edge; transition midpoint; mix transform; bloom; noise/image flow; flow bypass; resize; RGBA8 fallback; GL errors.';
} catch(error){result.textContent='FAIL: '+error.stack}
</script>
