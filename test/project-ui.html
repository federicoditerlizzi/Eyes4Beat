<!doctype html><meta charset="utf-8"><title>Engine boundary smoke</title><pre id="result">RUNNING</pre>
<script type="module">
import { LocalLibraryRepository } from '../src/library/local-repository.js';
import { cacheUserKey } from '../src/library/sync-logic.js';
import { NEUTRAL_LOOK } from '../src/looks.js';
import { blankMap } from '../src/config.js';
import { defaultImageConfig } from '../src/library/runtime.js';
const output=document.querySelector('#result'),assert=(value,message)=>{if(!value)throw new Error(message)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,label){for(let i=0;i<160;i++){if(check())return;await wait(100)}throw new Error('Timed out: '+label)}
const previousUser=localStorage.getItem('eyes4beat_last_sync_user'),previousScale=localStorage.getItem('eyes4beat_render_scale'),previousQuality=localStorage.getItem('eyes4beat_bloom_quality');let frame,channel;
try{
 assert(['localhost','127.0.0.1'].includes(location.hostname),'Use isolated localhost browser only');
 const user='engine-test-'+Date.now()+'@example.invalid';localStorage.setItem('eyes4beat_last_sync_user',user);
 const repo=new LocalLibraryRepository('eyes4beat-cache-'+cacheUserKey(user)),project=await repo.createProject('Engine smoke');
 const media=[];
 for(const color of ['#808080','#ffff40','#4080ff']){const canvas=document.createElement('canvas');canvas.width=96;canvas.height=64;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,96,64);const blob=await new Promise(r=>canvas.toBlob(r)),m=await repo.putMedia(blob);media.push({mediaId:m.id,mime:'image/png',name:color+'.png',size:blob.size})}
 const cfg=defaultImageConfig(media.length);cfg.mode='manual';cfg.triggers.manual.pool=['cut'];
 const records=[];for(const name of ['First','Second'])records.push(await repo.createArchetype(project.id,{name,look:NEUTRAL_LOOK,routingMap:blankMap(),imageConfig:cfg,media}));
 await repo.updateProject(project.id,{ownerEmail:user,visibility:'private'});
 const other=await repo.createProject('Non-current project');await repo.updateProject(other.id,{ownerEmail:user,visibility:'private'});
 const shared=await repo.createProject('Shared by another');await repo.updateProject(shared.id,{ownerEmail:'owner@example.invalid',visibility:'shared'});
 await repo.setActiveProject(project.id);
 let state;
 frame=document.createElement('iframe');frame.width=1280;frame.height=800;frame.src='/';document.body.appendChild(frame);
 await until(()=>frame.contentDocument?.querySelector('#lookBtn')?.disabled===false,'project');
 await until(()=>frame.contentWindow.EyesForBeatsEngine,'engine subscription');frame.contentWindow.EyesForBeatsEngine.subscribe(event=>{if(event.type==='state')state=event.state});await until(()=>state?.targetId===records[0].id,'snapshot');
 let doc=frame.contentDocument,win=frame.contentWindow;const $=id=>doc.getElementById(id);
 const change=(id,value,event='change')=>{const e=$(id);e.value=value;e.dispatchEvent(new win.Event(event,{bubbles:true}))};

 const requests=[],nativeFetch=win.fetch.bind(win);
 win.fetch=async(url,options={})=>{
  const path=String(url),method=options.method||'GET';
  if(!path.startsWith('/api/'))return nativeFetch(url,options);
  requests.push([method,path]);let payload={};
  if(path.startsWith('/api/changes'))payload={serverTime:new Date().toISOString(),projects:[],archetypes:[],lookPresets:[]};
  else if(path==='/api/me')payload={email:user};
  else{
   const match=path.match(/^\/api\/projects\/([^/?]+)(\/duplicate)?/);if(!match)throw Error('Unexpected API '+path);
   const id=match[1],body=options.body?JSON.parse(options.body):{};
   if(match[2])payload=await repo.duplicateProject(id,body.name);
   else if(method==='PATCH')payload=await repo.updateProject(id,body);
   else if(method==='DELETE')payload={};
   else payload={project:await repo.getProject(id),archetypes:await repo.listArchetypes(id),lookPresets:await repo.listLookPresets(id)};
  }
  return new win.Response(JSON.stringify(payload),{status:200,headers:{'Content-Type':'application/json'}});
 };
 await win.EyesForBeatsSync.sync();await wait(500);
 const press=(code,key)=>doc.dispatchEvent(new win.KeyboardEvent('keydown',{code,key,bubbles:true}));
 assert(!$('projectPanel')&&!$('projectSelect'),'old project panel/select removed');
 press('KeyJ','j');await until(()=>$('projectSwitcherList').children.length===3,'switcher projects');
 const choice=id=>doc.querySelector('.projectChoice[data-project-id="'+id+'"]');
 assert(choice(project.id).getAttribute('aria-checked')==='true','current highlighted');
 assert(choice(shared.id).textContent.includes('owner@example.invalid')&&choice(shared.id).textContent.includes('SHARED'),'shared owner badge');
 choice(other.id).focus();press('ArrowDown','ArrowDown');assert(doc.activeElement!==choice(other.id),'arrow navigation');
 choice(other.id).focus();press('Enter','Enter');await until(()=>state.projectId===other.id&&$('projectSwitcher').hidden,'keyboard switch closes');
 $('projectManageBtn').click();await until(()=>!$('projectSwitcher').hidden,'reopen');choice(project.id).click();await until(()=>state.projectId===project.id,'restore current');
 $('projectManageBtn').click();$('manageLibrary').click();await until(()=>$('libraryDialog').open,'library');
 const row=id=>doc.querySelector('#projectRows tr[data-project-id="'+id+'"]');
 await until(()=>row(shared.id),'rows');assert(!row(shared.id).querySelector('[data-action=share],[data-action=delete]'),'owner-only actions hidden');
 const action=kind=>row(other.id).querySelector('[data-action="'+kind+'"]').click();
 action('rename');press('Escape','Escape');assert(!$('projectNameDialog').open&&$('libraryDialog').open,'Escape closes only nested dialog');await wait(100);
 action('rename');$('projectNameInput').value='Renamed other';$('projectNameForm').requestSubmit();await until(()=>!$('projectNameDialog').open,'rename');
 assert((await repo.getProject(other.id)).name==='Renamed other'&&state.projectId===project.id,'rename non-current');
 action('share');await until(()=>row(other.id)?.textContent.includes('SHARED'),'share');
 assert(state.projectId===project.id&&requests.some(([m,p])=>m==='PATCH'&&p.includes(other.id)),'share correct id');
 action('duplicate');await until(()=>$('projectRows').children.length===4,'duplicate');assert(state.projectId===project.id,'duplicate does not switch');
 let exportUrl;const originalClick=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){if(this.download)exportUrl=this.href;else originalClick.call(this)};
 action('export');await until(()=>!!exportUrl,'export non-current');assert(state.projectId===project.id,'export does not switch');
 const {readPackage}=await import('../src/package-format.js'),pack=await readPackage(new Uint8Array(await(await nativeFetch(exportUrl)).arrayBuffer()));
 assert(pack.manifest.project.name==='Renamed other','export right project');
 doc.querySelector('.packageDialog[open]:not(#libraryDialog) .closeAction').click();
 action('delete');$('projectNameInput').value='Renamed other';$('projectNameForm').requestSubmit();await until(()=>!row(other.id),'delete non-current');assert(state.projectId===project.id,'delete keeps current');
 $('closeLibrary').click();$('accountBtn').click();assert(!$('accountMenu').hidden&&$('accountEmail').textContent===user,'account dropdown');
 $('syncNow').click();await wait(300);assert($('syncLast').textContent!=='Last sync: never','sync now');
 press('Escape','Escape');assert($('accountMenu').hidden,'account Escape');
 const top=doc.querySelector('.workspaceHeader');assert(top.scrollWidth<=top.clientWidth,'1280 header overflow');
 $('projectManageBtn').click();press('KeyQ','q');assert($('projectSwitcher').hidden,'perform closes menus');press('KeyK','k');assert($('accountMenu').hidden,'perform blocks account');press('KeyQ','q');
 $('projectManageBtn').click();$('manageLibrary').click();assert($('libraryDialog').getBoundingClientRect().right<=win.innerWidth,'1280 modal bounds');
 output.textContent='PASS: project switcher keyboard, non-current rename/duplicate/share/delete/export, owner permissions, account and 1280px';
}catch(error){output.textContent='FAIL: '+error.stack;throw error}
</script>
