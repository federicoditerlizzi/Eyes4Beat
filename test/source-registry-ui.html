<!doctype html><meta charset="utf-8"><title>Engine boundary smoke</title><pre id="result">RUNNING</pre>
<script type="module">
import { LocalLibraryRepository } from '../src/library/local-repository.js';
import { cacheUserKey } from '../src/library/sync-logic.js';
import { NEUTRAL_LOOK } from '../src/looks.js';
import { registerSource } from '../src/source-registry.js';
import { blankMap } from '../src/config.js';
import { defaultImageConfig } from '../src/library/runtime.js';
const output=document.querySelector('#result'),assert=(value,message)=>{if(!value)throw new Error(message)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,label){for(let i=0;i<160;i++){if(check())return;await wait(100)}throw new Error('Timed out: '+label)}
const previousUser=localStorage.getItem('eyes4beat_last_sync_user'),previousScale=localStorage.getItem('eyes4beat_render_scale'),previousQuality=localStorage.getItem('eyes4beat_bloom_quality');let frame,channel;
try{
 assert(['localhost','127.0.0.1'].includes(location.hostname),'Use isolated localhost browser only');
 const user='engine-test-'+Date.now()+'@example.invalid';localStorage.setItem('eyes4beat_last_sync_user',user);
 const repo=new LocalLibraryRepository('eyes4beat-cache-'+cacheUserKey(user)),project=await repo.createProject('Engine smoke');
 const media=[];
 for(const color of ['#808080','#ffff40','#4080ff']){const canvas=document.createElement('canvas');canvas.width=96;canvas.height=64;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,96,64);const blob=await new Promise(r=>canvas.toBlob(r)),m=await repo.putMedia(blob);media.push({mediaId:m.id,mime:'image/png',name:color+'.png',size:blob.size})}
 const cfg=defaultImageConfig(media.length);cfg.mode='manual';cfg.triggers.manual.pool=['cut'];
 const records=[];for(const name of ['First','Second'])records.push(await repo.createArchetype(project.id,{name,look:NEUTRAL_LOOK,routingMap:blankMap(),imageConfig:cfg,media}));
 const legacyRouting=blankMap();legacyRouting.level.pulse=-0.7;
 await repo.updateArchetype(records[0].id,{musicPresets:[{name:'Existing preset',routing:legacyRouting,amounts:{level:0.31},intensity:{pulse:0.28},reactivity:{pulse:0.6}}]});
 await repo.setActiveProject(project.id);
 let state;
 frame=document.createElement('iframe');frame.width=1280;frame.height=800;frame.src='/';document.body.appendChild(frame);
 await until(()=>frame.contentDocument?.querySelector('#lookBtn')?.disabled===false,'project');
 await until(()=>frame.contentWindow.EyesForBeatsEngine,'engine subscription');frame.contentWindow.EyesForBeatsEngine.subscribe(event=>{if(event.type==='state')state=event.state});await until(()=>state?.targetId===records[0].id,'snapshot');
 let doc=frame.contentDocument,win=frame.contentWindow;const $=id=>doc.getElementById(id);
 const change=(id,value,event='change')=>{const e=$(id);e.value=value;e.dispatchEvent(new win.Event(event,{bubbles:true}))};

 const nativeFetch=win.fetch.bind(win);
 win.alert=message=>{throw new Error(message)};
 win.fetch=async(url,options={})=>{
  const path=String(url),method=options.method||'GET',body=options.body?JSON.parse(options.body):{};if(!path.startsWith('/api/'))return nativeFetch(url,options);
  let payload={};
  if(path.startsWith('/api/changes'))payload={serverTime:new Date().toISOString(),projects:[],archetypes:[],lookPresets:[]};
  else if(path==='/api/me')payload={email:user};
  else if(path.endsWith('/look-presets')&&method==='POST')payload=await repo.createLookPreset(project.id,body.name,body.look);
  else if(path.startsWith('/api/look-presets/')){const id=path.split('/')[3].split('?')[0];if(method==='DELETE')await repo.deleteLookPreset(id);else payload=await repo.updateLookPreset(id,body)}
  else if(path.startsWith('/api/archetypes/')){const id=path.split('/')[3];payload=method==='PATCH'?await repo.updateArchetype(id,body):await repo.getArchetype(id)}
  else if(path.startsWith('/api/projects/'))payload={project:await repo.getProject(project.id),archetypes:await repo.listArchetypes(project.id),lookPresets:await repo.listLookPresets(project.id)};
  return new win.Response(JSON.stringify(payload),{status:200,headers:{'Content-Type':'application/json'}});
 };
 await win.EyesForBeatsSync.sync();
 const visible=node=>node.getBoundingClientRect().width>0&&win.getComputedStyle(node).display!=='none';
 const press=code=>doc.dispatchEvent(new win.KeyboardEvent('keydown',{code,key:code==='Escape'?'Escape':'',bubbles:true}));

 const defs=[{id:'midiFader',label:'MIDI Fader',kind:'continuous',group:'midi'},{id:'midiPad',label:'MIDI Pad',kind:'event',group:'midi'}];
 for(const def of defs){registerSource(def);win.EyesForBeatsSources.register(def)}
 $('routingTab').click();
 for(const def of defs){assert(doc.querySelector('[data-p="'+def.id+'"]').textContent.includes(def.label),'source row label');assert(doc.querySelector('[data-diagnostic-source="'+def.id+'"]'),'diagnostic source');assert([...$('imageSource').options].some(o=>o.value===def.id&&o.textContent===def.label),'image source');for(const select of doc.querySelectorAll('[data-target-source]'))assert([...select.options].some(o=>o.value===def.id&&o.textContent===def.label),'target option')}
 const source=doc.querySelector('[data-target-source="pulse"]');source.value='midiFader';source.dispatchEvent(new win.Event('change',{bubbles:true}));
 change('amt-midiFader','0.6','input');change('g-pulse','1','input');change('ga-pulse','1','input');
 await win.EyesForBeatsSources.publish({midiFader:.8});await until(()=>state.eff.midiFader>.47&&state.finalG.pulse>.1,'external routing without audio');
 $('presetSave').click();$('newPresetName').value='External controls';$('presetDialogForm').dispatchEvent(new win.Event('submit',{bubbles:true,cancelable:true}));await wait(700);
 const saved=await repo.getArchetype(records[0].id);assert(saved.musicPresets.some(p=>p.amounts.midiFader===.6&&p.routing.midiFader.pulse===1),'custom preset persisted');
 $('imageMgrBtn').click();change('imageMode','mapped');change('imageSource','midiPad');assert(!$('imageThreshold').closest('.ctlBox').hidden,'external event threshold visible');
 $('lookBtn').click();const trigger=doc.querySelector('[data-path="particles.burst.trigger"]');assert(trigger.textContent.includes('MIDI Pad')&&!trigger.textContent.includes('MIDI Fader'),'only event triggers');trigger.querySelector('[data-value="midiPad"]').click();
 await win.EyesForBeatsSources.publish({midiPad:.7});await until(()=>state.eff.midiPad>0,'event intensity');await wait(600);assert(state.eff.midiPad<.1,'event decay');
 const nativeOpen=win.open.bind(win);let outputWindow;win.open=(...args)=>outputWindow=nativeOpen(...args);
 $('closeInspector').click();$('outputBtn').click();await until(()=>doc.body.classList.contains('remoteControl'),'remote connected');
 await until(()=>outputWindow?.document.querySelector('#outputStart')?.disabled===false,'output unlock');outputWindow.document.querySelector('#outputStart').click();
 await win.EyesForBeatsSources.publish({midiFader:.9});await until(()=>state.eff.midiFader>.53&&state.finalG.pulse>.1,'external source routes in output');
 const registryUrl=outputWindow.performance.getEntriesByType('resource').find(entry=>entry.name.includes('/src/source-registry.js')).name;
 const outputRegistry=await outputWindow.eval('import('+JSON.stringify(registryUrl)+')');assert(outputRegistry.getSources().some(s=>s.id==='midiFader'),'same output registry module');
 outputRegistry.registerSource({id:'enginePad',label:'Engine pad',kind:'event',group:'midi'});await until(()=>doc.querySelector('[data-p=enginePad]'),'engine-origin source in control');outputRegistry.unregisterSource('enginePad');await until(()=>!doc.querySelector('[data-p=enginePad]'),'engine-origin unregister');
 for(const id of ['remoteOne','remoteTwo'])win.EyesForBeatsSources.register({id,label:id,kind:'continuous',group:'midi'});await wait(300);assert(win.EyesForBeatsSources.list().some(s=>s.id==='remoteOne')&&win.EyesForBeatsSources.list().some(s=>s.id==='remoteTwo'),'rapid remote registrations survive echoes');
 for(const id of ['remoteOne','remoteTwo'])win.EyesForBeatsSources.unregister(id);
 $('lookBtn').click();
 win.EyesForBeatsSources.unregister('midiPad');win.EyesForBeatsSources.unregister('midiFader');await wait(150);
 assert(!doc.querySelector('[data-p="midiPad"]')&&!doc.querySelector('[data-diagnostic-source="midiFader"]'),'unregister removes rows');
 assert(!doc.querySelector('[data-path="particles.burst.trigger"] [data-value="midiPad"]'),'unregister removes burst option');
 assert(doc.querySelector('[data-path="particles.burst.trigger"] select').value==='none','burst becomes none');
 $('imageMgrBtn').click();assert($('imageSource').value==='none','image becomes none');$('routingTab').click();assert(source.value==='','target becomes none');
 outputWindow.close();
 output.textContent='PASS: runtime sources in routing, presets, images, bursts and diagnostics; intensity routing and unregister cleanup';
}catch(error){output.textContent='FAIL: '+error.stack;throw error}
</script>
