<!doctype html><meta charset="utf-8"><title>Engine boundary smoke</title><pre id="result">RUNNING</pre>
<script type="module">
import { LocalLibraryRepository } from '../src/library/local-repository.js';
import { cacheUserKey } from '../src/library/sync-logic.js';
import { LOOK_GROUPS } from '../src/ui/look-editor.js';
import { NEUTRAL_LOOK } from '../src/looks.js';
import { blankMap } from '../src/config.js';
import { defaultImageConfig } from '../src/library/runtime.js';
const output=document.querySelector('#result'),assert=(value,message)=>{if(!value)throw new Error(message)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(check,label){for(let i=0;i<160;i++){if(check())return;await wait(100)}throw new Error('Timed out: '+label)}
const previousUser=localStorage.getItem('eyes4beat_last_sync_user'),previousScale=localStorage.getItem('eyes4beat_render_scale'),previousQuality=localStorage.getItem('eyes4beat_bloom_quality');let frame,channel;
try{
 assert(['localhost','127.0.0.1'].includes(location.hostname),'Use isolated localhost browser only');
 const user='engine-test-'+Date.now()+'@example.invalid';localStorage.setItem('eyes4beat_last_sync_user',user);
 const repo=new LocalLibraryRepository('eyes4beat-cache-'+cacheUserKey(user)),project=await repo.createProject('Engine smoke');
 const media=[];
 for(const color of ['#808080','#ffff40','#4080ff']){const canvas=document.createElement('canvas');canvas.width=96;canvas.height=64;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,96,64);const blob=await new Promise(r=>canvas.toBlob(r)),m=await repo.putMedia(blob);media.push({mediaId:m.id,mime:'image/png',name:color+'.png',size:blob.size})}
 const cfg=defaultImageConfig(media.length);cfg.mode='manual';cfg.triggers.manual.pool=['cut'];
 const records=[];for(const name of ['First','Second'])records.push(await repo.createArchetype(project.id,{name,look:NEUTRAL_LOOK,routingMap:blankMap(),imageConfig:cfg,media}));
 await repo.setActiveProject(project.id);
 let state;
 frame=document.createElement('iframe');frame.width=1280;frame.height=800;frame.src='/';document.body.appendChild(frame);
 await until(()=>frame.contentDocument?.querySelector('#lookBtn')?.disabled===false,'project');
 await until(()=>frame.contentWindow.EyesForBeatsEngine,'engine subscription');frame.contentWindow.EyesForBeatsEngine.subscribe(event=>{if(event.type==='state')state=event.state});await until(()=>state?.targetId===records[0].id,'snapshot');
 let doc=frame.contentDocument,win=frame.contentWindow;const $=id=>doc.getElementById(id);
 const change=(id,value,event='change')=>{const e=$(id);e.value=value;e.dispatchEvent(new win.Event(event,{bubbles:true}))};

 $('lookBtn').click();
 const root=$('lookFields'),groups=[...root.children];
 assert(groups.map(g=>g.dataset.lookGroup).join(',')==='color,distortion,particles,bloom,pulse,rotation,frame','group order');
 assert(!root.querySelector('[data-look-group=color] [data-routing-target]')&&!root.querySelector('[data-look-group=frame] [data-routing-target]'),'no color/frame routing');
 for(const advanced of root.querySelectorAll('.lookAdvanced'))assert(!advanced.open,'advanced starts closed');
 for(const group of groups){
  group.open=true;
  const advanced=group.querySelector('.lookAdvanced');if(advanced)advanced.open=true;
  for(const row of group.querySelectorAll('.lookField')){
   const slider=row.querySelector('input[type=range]'),color=row.querySelector('input[type=color]'),checkbox=row.querySelector('input[type=checkbox]'),segments=row.querySelector('.lookSegments');
   if(slider){slider.value=String((Number(slider.min)+Number(slider.max))/2);slider.dispatchEvent(new win.Event('input',{bubbles:true}))}
   else if(color){color.value='#12abef';color.dispatchEvent(new win.Event('input',{bubbles:true}))}
   else if(checkbox){checkbox.checked=!checkbox.checked;checkbox.dispatchEvent(new win.Event('input',{bubbles:true}))}
   else if(segments)segments.lastElementChild.click();
   assert(row.querySelector('input,select'),'editable '+row.dataset.path);
  }
 }
 for(let i=0;i<80;i++){if((await repo.getArchetype(records[0].id)).look.frame.fit==='stretch')break;await wait(100)}
 const saved=await repo.getArchetype(records[0].id);assert(saved.look.color.tint==='#12abef'&&saved.look.frame.fit==='stretch','live edits persisted '+JSON.stringify(saved.look));
 const gain=root.querySelector('[data-path="color.gain"]');gain.querySelector('.lookValue').click();
 const editor=gain.querySelector('.lookValueEditor');assert(!editor.hidden,'numeric editor opens');editor.value='1.37';editor.dispatchEvent(new win.Event('input',{bubbles:true}));editor.blur();
 for(let i=0;i<80;i++){if((await repo.getArchetype(records[0].id)).look.color.gain===1.37)break;await wait(100)}
 assert((await repo.getArchetype(records[0].id)).look.color.gain===1.37,'precise value persists');
 root.querySelector('[data-look-group=color] .lookGroupReset').click();
 for(let i=0;i<80;i++){if((await repo.getArchetype(records[0].id)).look.color.gain===1)break;await wait(100)}
 assert((await repo.getArchetype(records[0].id)).look.color.gain===1,'color reset');
 assert((await repo.getArchetype(records[0].id)).look.frame.fit==='stretch','reset isolated');
 const bloom=root.querySelector('[data-look-group=bloom]');bloom.open=false;await wait(100);
 $('closeInspector').click();$('lookBtn').click();assert(!root.querySelector('[data-look-group=bloom]').open,'disclosure remembered');
 root.querySelector('[data-routing-target=rotate]').click();assert($('openMatrix').getAttribute('aria-selected')==='true','routing link');
 const route=doc.querySelector('.routeSource[data-t=rotate]');route.value='energy';route.dispatchEvent(new win.Event('change',{bubbles:true}));
 $('lookBtn').click();assert(root.querySelector('[data-routing-target=rotate]').textContent.includes('Energy'),'routing hint refreshed');
 const openState=JSON.parse(win.localStorage.getItem('eyes4beat_look_groups'));assert(openState.bloom===false,'device state saved');
 output.textContent='PASS: every look parameter, slider precision, segmented enums, colors, advanced, group reset, device state and routing hints';
}catch(error){output.textContent='FAIL: '+error.stack;throw error}
</script>
